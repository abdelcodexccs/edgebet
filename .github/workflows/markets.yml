name: Markets backtest (temporary)
on:
  workflow_dispatch:
    inputs:
      years:
        default: "10"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u backtest_markets.py --years ${{ github.event.inputs.years }}
