name: EdgeBet daily

on:
  schedule:
    - cron: "17 7 * * *"   # every day ~07:17 UTC (GitHub may start it late or skip it)
    - cron: "43 9 * * *"   # backup run ~09:43 UTC; posts only what the first run didn't
    - cron: "51 22 * * *"  # evening run ~22:51 UTC: posts tonight's results only
  workflow_dispatch:        # "Run workflow" button for a manual run
    inputs:
      mode:
        description: "live = really post, dry = test only (nothing posted or saved)"
        default: live
        type: choice
        options: [live, dry]
      results_only:
        description: "true = only post results, no new picks"
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write           # lets the run save the pick record back to this repo
  actions: write            # lets the run start the live watcher

concurrency:
  group: edgebet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daily cycle (results, picks, Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          POST_MODE: ${{ github.event.inputs.mode || vars.POST_MODE || 'live' }}
          PUBLISH_TO: telegram
          LEAGUES: ${{ vars.LEAGUES || 'E0,SP1,I1,D1,F1,UCL' }}
          MAX_PICKS_PER_DAY: ${{ vars.MAX_PICKS_PER_DAY || '3' }}
          DAILY_PICK: ${{ vars.DAILY_PICK || 'true' }}
          LEAN_STAKE: "0.005"
          BANKROLL: ${{ vars.BANKROLL || '5000' }}
          TIMEZONE: Africa/Casablanca
          ODDS_REGIONS: eu
          RESULTS_ONLY: ${{ github.event.schedule == '51 22 * * *' || github.event.inputs.results_only == 'true' }}
        run: |
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID ODDS_API_KEY; do
            v="${!k}"; t="$(printf %s "$v" | tr -d '[:space:]')"
            if [ -n "$v" ]; then echo "::notice::$k is set (${#t} characters$( [ "${#t}" != "${#v}" ] && echo ', had spaces/new lines'))"; else echo "::warning::$k is missing (add it under Settings > Secrets > Actions)"; fi
          done
          set -o pipefail
          python daily.py 2>&1 | tee run.log || { grep -E "Error|error:|credits|refreshed|Traceback" run.log | tail -n 6 | sed "s/^/::error::/"; exit 1; }
          grep -E "PICK|Games checked|record:|ALERT|saved" run.log | head -20 | sed 's/^/::notice::/' || true
      - name: Save pick record and fresh data
        if: always() && github.event.inputs.mode != 'dry'
        run: |
          git config user.name "edgebet-bot"
          git config user.email "edgebet-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push
      - name: Start the live watcher (goal alerts + results at full time)
        if: always() && github.event.inputs.mode != 'dry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q ",pending," state/ledger.csv; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/live.yml/dispatches" -f ref="${GITHUB_REF_NAME}" && echo "::notice::live watcher started"
          else
            echo "no pending picks, live watcher not needed"
          fi
